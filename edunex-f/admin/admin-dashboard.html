<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Analytics | EduNex</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="motion.css">
  <script src="motion.js" defer></script>
  <link rel="stylesheet" href="premium-nav.css">
  <link rel="stylesheet" href="admin-theme.css">
  <script src="admin-env.js"></script>
  <script src="admin-common.js"></script>
  <script src="premium-nav.js" defer></script>
</head>
<body class="premium-nav-page premium-nav-admin">
  <nav class="premium-site-nav" data-premium-nav>
    <div class="premium-nav-panel">
      <a aria-label="EduNex admin home" class="premium-brand" href="admin-dashboard.html">
        <span class="premium-brand-mark" aria-hidden="true"></span>
        <span class="premium-brand-name">Edu<span>Nex</span></span>
      </a>
      <div class="premium-nav-links"></div>
      <div class="premium-nav-actions"></div>
    </div>
  </nav>

  <main class="app-shell dashboard-shell">
    <header class="app-header dashboard-header">
      <div>
        <div class="brand-mark">E</div>
        <h1 class="app-title">Analytics</h1>
        <p class="app-subtitle">Platform revenue, learners, subscriptions, and course engagement.</p>
      </div>
      <nav class="toolbar-actions" aria-label="Admin navigation">
        <a class="toolbar-button" href="admin-users.html">Users</a>
        <a class="toolbar-button" href="admin-courses.html">Courses</a>
        <a class="toolbar-button" href="course-posting.html">Upload</a>
        <button class="toolbar-button" id="refreshButton" type="button">Refresh</button>
        <button class="toolbar-button" id="logoutButton" type="button">Log out</button>
      </nav>
    </header>

    <div class="message" id="message" role="status"></div>

    <section class="analytics-grid" id="metricsGrid" aria-label="Analytics summary">
      <div class="loading-state">Loading analytics...</div>
    </section>

    <section class="admin-panels">
      <article class="dashboard-panel">
        <h2 class="panel-title">Recent Users</h2>
        <div class="data-list" id="recentUsers"></div>
      </article>
      <article class="dashboard-panel">
        <h2 class="panel-title">Recent Orders</h2>
        <div class="data-list" id="recentOrders"></div>
      </article>
      <article class="dashboard-panel">
        <h2 class="panel-title">Top Courses</h2>
        <div class="data-list" id="topCourses"></div>
      </article>
      <article class="dashboard-panel">
        <h2 class="panel-title">System Mix</h2>
        <div class="data-list" id="breakdowns"></div>
      </article>
    </section>
  </main>

  <script>
    AdminPanel.requireAdmin();

    const message = document.getElementById('message');
    const metricsGrid = document.getElementById('metricsGrid');
    const recentUsers = document.getElementById('recentUsers');
    const recentOrders = document.getElementById('recentOrders');
    const topCourses = document.getElementById('topCourses');
    const breakdowns = document.getElementById('breakdowns');

    document.getElementById('logoutButton').addEventListener('click', AdminPanel.logout);
    document.getElementById('refreshButton').addEventListener('click', loadAnalytics);

    function money(value) {
      return `₹${AdminPanel.formatNumber(value)}`;
    }

    function row(title, meta, value) {
      return `
        <div class="data-row">
          <div><strong>${AdminPanel.escapeHtml(title)}</strong><span>${AdminPanel.escapeHtml(meta)}</span></div>
          <b>${AdminPanel.escapeHtml(value)}</b>
        </div>
      `;
    }

    function renderList(element, rows, emptyText) {
      element.innerHTML = rows.length ? rows.join('') : `<div class="empty-state compact-empty">${emptyText}</div>`;
    }

    async function loadAnalytics() {
      AdminPanel.showMessage(message, '', 'success');
      metricsGrid.innerHTML = '<div class="loading-state">Loading analytics...</div>';

      try {
        const response = await AdminPanel.request('/api/admin/analytics');
        const data = await response.json();
        if (!response.ok) throw new Error(AdminPanel.errorMessage(data, 'Unable to load analytics.'));

        const totals = data.totals || {};
        const learning = data.learning || {};
        const metrics = [
          ['Users', totals.users],
          ['Active Users', totals.activeUsers],
          ['Subscriptions', totals.activeSubscriptions],
          ['Trial Users', totals.trialUsers || totals.oneRupeeTrialUsers],
          ['Courses', totals.courses],
          ['Published', totals.publishedCourses],
          ['Revenue Range', money(totals.revenueInRange)],
          ['Watched Minutes', learning.watchedMinutes],
        ];

        metricsGrid.innerHTML = metrics.map(([label, value]) => `
          <div class="metric-card"><span>${AdminPanel.escapeHtml(value ?? 0)}</span><strong>${AdminPanel.escapeHtml(label)}</strong></div>
        `).join('');

        renderList(recentUsers, (data.recentUsers || []).slice(0, 8).map((user) => (
          row(user.fullName || user.email || user.mobileNumber || 'Learner', AdminPanel.formatDate(user.createdAt), user.subscriptionStatus || 'none')
        )), 'No recent users.');

        renderList(recentOrders, (data.recentOrders || []).slice(0, 8).map((order) => (
          row(order.orderId || order.merchantTransactionId || 'Order', order.status || 'pending', money(order.amount || order.amountInRupees || 0))
        )), 'No recent orders.');

        renderList(topCourses, (data.topCourses || data.topSellingCourses || []).slice(0, 8).map((course) => (
          row(course.title || course.courseTitle || 'Course', `${AdminPanel.formatNumber(course.learnerCount || course.startedCount || 0)} learners`, `${AdminPanel.formatNumber(course.completedCount || course.totalCompleted || 0)} done`)
        )), 'No course analytics yet.');

        const subscriptionStatus = data.breakdowns?.userSubscriptionStatus || data.breakdowns?.subscriptionStatus || {};
        renderList(breakdowns, Object.entries(subscriptionStatus).slice(0, 8).map(([label, count]) => (
          row(label || 'unknown', 'Subscription status', AdminPanel.formatNumber(count))
        )), 'No breakdown data.');
      } catch (error) {
        metricsGrid.innerHTML = '<div class="empty-state">Unable to load analytics.</div>';
        renderList(recentUsers, [], 'No recent users.');
        renderList(recentOrders, [], 'No recent orders.');
        renderList(topCourses, [], 'No course analytics yet.');
        renderList(breakdowns, [], 'No breakdown data.');
        AdminPanel.showMessage(message, error.message || 'Unable to load analytics.', 'error');
      }
    }

    loadAnalytics();
  </script>
</body>
</html>
